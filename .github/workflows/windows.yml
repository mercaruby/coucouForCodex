name: Windows integration checks
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: windows/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Compile frontend and relay
        run: npm run build
      - name: Run protocol and security tests
        run: cargo test --workspace --locked
      - name: Build native application
        run: cargo build -p coucou --locked
      # Personal source fork: no installer uploads or release publication.
